services:
  postgres:
    image: postgres:16-alpine
    container_name: gateway-sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway_sales
    ports:
      - "5433:5432"
    volumes:
      - gateway_sales_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_sales"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gateway_sales_data:
